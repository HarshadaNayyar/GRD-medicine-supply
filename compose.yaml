services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: grd
      POSTGRES_USER: grd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grd"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://grd:${POSTGRES_PASSWORD}@db:5432/grd
    command: ["grd", "migrate"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://grd:${POSTGRES_PASSWORD}@db:5432/grd
    ports:
      - "127.0.0.1:8011:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://grd:${POSTGRES_PASSWORD}@db:5432/grd
    command: ["grd", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
