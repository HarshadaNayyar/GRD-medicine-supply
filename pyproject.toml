[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grd-supply-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.18",
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.5,<2", "openpyxl>=3.1,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[project.scripts]
grd = "grd.cli:main"
[tool.setuptools.packages.find]
include = ["grd*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
