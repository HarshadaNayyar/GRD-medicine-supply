name: Product checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grd
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: grd_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U grd" --health-interval 5s --health-retries 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      GRD_TOKEN_SECRET: ci-only-not-a-production-secret-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check grd tests
      - run: pytest -q
      - run: grd migrate && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://grd:ci-only-password@localhost:5432/grd_test
      - run: GRD_TEST_DATABASE_URL=postgresql+psycopg://grd:ci-only-password@localhost:5432/grd_test pytest tests/test_postgres.py -q
